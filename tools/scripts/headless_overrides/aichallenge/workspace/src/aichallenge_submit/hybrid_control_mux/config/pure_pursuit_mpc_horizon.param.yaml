hybrid_control_mux_node:
  ros__parameters:
    enabled: true
    primary_source: "pure_pursuit"
    control_rate_hz: 50.0
    mpc_cmd_timeout_sec: 0.35
    pure_pursuit_cmd_timeout_sec: 0.20
    pure_pursuit_tracking_status_timeout_sec: 0.20
    state_lattice_instant_control_enabled: false
    state_lattice_cmd_timeout_sec: 0.12
    state_lattice_max_steering_angle_rad: 0.5236
    state_lattice_max_steering_rate_radps: 0.35
    free_run_live_exact_observe_enabled: true
    free_run_live_exact_pre_ack_hold_enabled: true
    # SourceKey provenance is matching-only; its ceiling matches the current
    # formal Pure Pursuit trajectory freshness bound.
    free_run_source_provenance_timeout_sec: 1.5
    mpc_health_timeout_sec: 0.50
    safety_constraint_enabled: true
    safety_constraint_timeout_sec: 0.20
    safety_constraint_max_speed_mps: 15.0
    # current-d STOP proofは次のPASS warm-up発行だけに使う。実運用Plannerの
    # safe_stop_v_mpsと同じ上限を超えるSTOP契約はbootstrapへ使わない。
    planner_stop_release_bootstrap_max_speed_mps: 0.20
    safety_constraint_max_brake_decel_mps2: 1.5
    control_loop_max_gap_sec: 0.10
    ros_clock_stall_timeout_sec: 0.20
    race_arm_required: true
    motion_authority_grant_lease_sec: 0.04
    motion_authority_warmup_proof_timeout_sec: 0.50
    control_fault_clear_safe_cycles: 3
    lateral_stop_steering_hold_timeout_sec: 0.12
    fallback_trigger_infeasible_count: 1
    fallback_release_solved_cycles: 1
    fallback_min_hold_sec: 0.0
    fallback_speed_mps: 10.0
    fallback_accel_max_mps2: 2.0
    fallback_decel_min_mps2: -1.5
    recovery_enabled: false
    recovery_cmd_timeout_sec: 0.15
    recovery_status_timeout_sec: 0.20
    recovery_permit_timeout_sec: 0.30
    external_safety_timeout_sec: 0.20
    require_recovery_external_safety_status: true
    recovery_speed_mps: 0.7
    recovery_accel_max_mps2: 1.3
    recovery_decel_min_mps2: -1.5
    recovery_max_duration_sec: 3.0
    stop_decel_mps2: -1.5
    finish_stop_enabled: true
    # 8.8 m/sでFinishした実bagでは-1.5 m/s^2だと停止距離が約26 mとなり、
    # 完走後に壁接触した。AWSIMの既知の縦加速度範囲内でterminal停止する。
    finish_stop_decel_mps2: -3.2
    # Finish latch時に使う、実publish済み操舵のsteady-clock上限 [s]。
    finish_terminal_reference_timeout_sec: 0.20
    # path追従操舵は残すが、rejoin由来の急舵をhard brakingへ持ち越さない。
    finish_stop_max_steering_rad: 0.20
    # Finish直前の実出力がこの値を超えた時だけ急舵guardをlatchedする。
    finish_stop_steering_guard_trigger_rad: 0.35
    use_pure_pursuit_on_mpc_cmd_timeout: true
    use_pure_pursuit_on_mpc_health_timeout: false
    use_mpc_on_pure_pursuit_cmd_timeout: false
    debug_publish_period_sec: 0.25
    enable_steering_rate_limit: true
    # vehicle_infoと共通化したvirtual tire angle hard stop。
    max_steering_angle_rad: 0.64
    tracking_usable_max_steering_angle_rad: 0.64
    max_steering_rate_radps: 0.5
    max_steering_delta_per_cycle: 0.0
    steering_limiter_reset_dt_sec: 0.50
    reset_steering_limiter_on_mode_change: false
    steering_log_throttle_sec: 1.0
