name: aic-test

on:
  pull_request:
    paths:
      - "tools/aic_test/**"
      - "aichallenge/workspace/src/aichallenge_submit/**"
      - "vehicle/cyclonedds.xml"
      - ".github/workflows/aic-test.yaml"
  push:
    branches: [main]
    paths:
      - "tools/aic_test/**"
      - "aichallenge/workspace/src/aichallenge_submit/**"
      - "vehicle/cyclonedds.xml"
      - ".github/workflows/aic-test.yaml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=7,<9"
      - name: Run aic-test unit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: tools/aic_test
        run: python -m pytest -p no:cacheprovider -q tools/aic_test/tests
