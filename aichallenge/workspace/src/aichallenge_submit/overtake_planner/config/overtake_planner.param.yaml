overtake_planner_node:
  ros__parameters:
    enabled: true
    reference_package: "multi_purpose_mpc_ros"
    reference_csv: "env/final_ver3/traj_mincurv_manual.csv"
    # "auto" resolves to d${ROS_DOMAIN_ID}; set d1..d4 explicitly to override.
    own_vehicle_id: "auto"
    ego_stale_time_sec: 0.50
    control_rate_hz: 20.0
    horizon_points: 50
    horizon_dt_sec: 0.025
    lookahead_s_m: 10.0
    follow_trigger_s_m: 5.0
    same_corridor_width_m: 0.90
    same_direction_filter_enabled: true
    same_direction_min_speed_mps: 0.30
    same_direction_min_s_dot_mps: 0.05
    future_side_prediction_enabled: true
    future_side_prediction_horizon_sec: 1.2
    future_side_prediction_dt_sec: 0.3
    future_side_yield_wall_clearance_m: 0.35
    dv_block_threshold_mps: 0.20
    opponent_stale_time_sec: 0.50
    side_by_side_s_m: 4.0
    side_margin_m: 1.20
    parallel_side_detection_enabled: true
    parallel_side_s_m: 12.0
    parallel_side_margin_m: 4.0
    side_yield_s_m: 0.30
    side_by_side_target_gap_m: 0.75
    side_by_side_shift_distance_m: 7.0
    side_by_side_speed_cap_mps: 7.5
    corner_side_yield_curvature_m_inv: 0.05
    corner_side_yield_lookahead_m: 10.0
    corner_side_yield_wall_clearance_m: 0.55
    corner_yield_target_d_m: 0.0
    corner_yield_rejoin_gap_m: 5.5
    yield_rejoin_wall_clearance_m: 0.25
    recovery_release_lateral_error_m: 0.60
    yield_release_lateral_error_m: 0.60
    corner_follow_speed_margin_mps: 0.20
    corner_yield_v_max_mps: 10.0
    straight_only_overtake_enabled: true
    straight_overtake_max_curvature_m_inv: 0.025
    straight_overtake_lookahead_m: 12.0
    straight_overtake_release_hysteresis_m_inv: 0.005
    overtake_permission_profile_enabled: true
    overtake_permission_package: "overtake_planner"
    overtake_permission_csv: "config/overtake_permission.csv"
    default_overtake_allowed: true
    overtake_permission_lookahead_m: 8.0
    slow_front_exception_enabled: true
    slow_front_exception_speed_mps: 1.0
    slow_front_exception_distance_m: 8.0
    slow_front_exception_required_cycles: 3
    # 停止/低速前走車でも、曲率gateを開くのは緩い曲線まで。permission/CBFは維持する。
    slow_front_exception_max_start_curvature_m_inv: 0.040
    slow_obstacle_chain_enabled: true
    slow_obstacle_chain_distance_m: 12.0
    large_lateral_error_threshold_m: 0.60
    large_lateral_error_v_max_mps: 10.0
    min_pass_gap_m: 1.8
    pass_gap_hysteresis_m: 0.25
    dynamic_pass_candidate_enabled: true
    yield_speed_margin_mps: 0.60
    # YIELD時の下限。通常のレース上限10 m/sではない。接近並走時に後方へ
    # 譲れるよう、CBFまで詰めてからsafe-stopへ落ちることを避ける。
    yield_min_speed_cap_mps: 0.50
    yield_rejoin_gap_m: 3.0
    # Planner safety prediction. Keep <= the verified active controller deceleration.
    # The default hybrid MPC permits -1.0 m/s^2; PP/mux fallback permits -1.5 m/s^2.
    max_brake_decel_mps2: 1.0
    longitudinal_response_delay_sec: 0.25
    stationary_obstacle_speed_threshold_mps: 0.30
    # 通常ライン復帰は全fresh V2X車両に対するRECOVERY軌道評価が連続で通るまで禁止する。
    # 壁マージン・安全楕円・MPC health guardを緩める代替ではない。
    reentry_gate_enabled: true
    reentry_safe_cycles: 5
    reentry_min_safety_margin_h: 0.30
    reentry_evaluation_horizon_sec: 4.0
    reentry_v2x_snapshot_stale_time_sec: 0.50
    reentry_hold_v_max_mps: 0.50
    # solve timeだけの一過性劣化では、全相手に再評価した現d holdに限り
    # このcapで待機する。CBF/stale/infeasibleは常にreentry_hold_v_max_mps。
    reentry_mpc_degraded_hold_v_max_mps: 3.0
    reentry_mpc_unhealthy_enter_samples: 2
    reentry_mpc_healthy_release_samples: 3
    reentry_require_mpc_health: true
    left_offset_m: 0.70
    right_offset_m: -0.70
    overtake_lateral_profile_mode: "localized_latched"  # legacy / localized_latched
    pass_horizon_publish_mode: "overtake_only"  # prepare_and_overtake / overtake_only
    localized_avoidance_start_before_target_m: 6.0
    localized_avoidance_full_offset_before_target_m: 2.0
    localized_avoidance_hold_after_target_m: 5.0
    localized_avoidance_merge_distance_m: 8.0
    maneuver_latch_min_hold_sec: 1.0
    maneuver_latch_target_update_alpha: 0.0
    prepare_distance_m: 8.0
    merge_distance_m: 12.0
    follow_speed_margin_mps: 0.01
    recovery_v_max_mps: 8.5
    wall_margin_recovery_v_max_mps: 8.5
    outside_corridor_recovery_centering_time_sec: 1.0
    v_passthrough_mps: 50.0
    d_min_m: -1.35
    d_max_m: 1.35
    min_wall_margin_m: 0.50
    safety_ellipse_a_m: 3.0
    safety_ellipse_b_m: 1.8
    min_ellipse_h: 0.20
    pass_safe_required_cycles: 5.0
    merge_front_gap_m: 6.0
    abort_timeout_sec: 5.0
    min_mode_hold_time_sec: 0.60
    keep_mode_bonus: 25.0
    lateral_target_max_step_m: 0.25
    high_speed_curve_lateral_hold_enabled: true
    high_speed_curve_lateral_hold_min_speed_mps: 4.0
    high_speed_curve_lateral_hold_release_speed_mps: 2.5
    high_speed_curve_lateral_hold_release_curvature_m_inv: 0.025
    speed_only_fallback_enabled: true
    speed_only_fallback_v_max_mps: 10.0
    # 追越禁止区間でreentry gateが許可した通常復帰だけのレース上限。fail-safe capとは別。
    normal_recovery_speed_only_v_max_mps: 10.0
    opponent_collision_fallback_v_max_mps: 0.5
    side_by_side_leader_priority_enabled: true
    side_by_side_leader_priority_enter_s_m: 1.0
    side_by_side_leader_priority_release_s_m: 0.3
    side_by_side_leader_priority_hold_sec: 1.0
    side_by_side_leader_priority_v_max_mps: 10.0
    wall_risk_speed_guard_enabled: true
    wall_soft_margin_m: 0.25
    wall_risk_v_max_mps: 8.0
    mpc_health_speed_guard_enabled: true
    mpc_health_infeasible_count_threshold: 1
    mpc_health_solve_time_warn_ms: 80.0
    mpc_health_v_max_mps: 10.0
    mpc_health_stale_time_sec: 0.60
    recovery_speed_guard_enabled: true
    recovery_speed_guard_v_max_mps: 10.0
    section_safety_profile_enabled: true
    # Add same-length arrays to enable section presets, e.g. names/profiles/start_wp/end_wp.
    safe_stop_enabled: true
    safe_stop_v_mps: 0.20
    safe_stop_trigger_cycles: 1
    start_grace_safe_stop_enabled: true
    start_grace_duration_sec: 8.0
    start_grace_max_speed_mps: 1.5
    safe_stop_release_cycles: 5
    safe_stop_release_front_gap_m: 5.0
    safe_stop_release_wall_clearance_m: 0.20
    safe_stop_lateral_error_threshold_m: 0.40
    safe_stop_release_speed_mps: 0.50
