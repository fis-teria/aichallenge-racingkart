hybrid_control_mux_node:
  ros__parameters:
    enabled: true
    control_rate_hz: 50.0
    mpc_cmd_timeout_sec: 0.20
    pure_pursuit_cmd_timeout_sec: 0.20
    mpc_health_timeout_sec: 0.75
    fallback_trigger_infeasible_count: 2
    fallback_release_solved_cycles: 3
    fallback_min_hold_sec: 1.0
    fallback_speed_mps: 2.0
    fallback_accel_max_mps2: 0.8
    fallback_decel_min_mps2: -1.5
    stop_decel_mps2: -1.5
    use_pure_pursuit_on_mpc_cmd_timeout: true
    use_pure_pursuit_on_mpc_health_timeout: false
    debug_publish_period_sec: 0.25
