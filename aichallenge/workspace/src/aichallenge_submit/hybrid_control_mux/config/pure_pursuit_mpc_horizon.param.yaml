hybrid_control_mux_node:
  ros__parameters:
    enabled: true
    primary_source: "pure_pursuit"
    control_rate_hz: 50.0
    mpc_cmd_timeout_sec: 0.35
    pure_pursuit_cmd_timeout_sec: 0.20
    mpc_health_timeout_sec: 0.50
    fallback_trigger_infeasible_count: 1
    fallback_release_solved_cycles: 1
    fallback_min_hold_sec: 0.0
    fallback_speed_mps: 10.0
    fallback_accel_max_mps2: 1.3
    fallback_decel_min_mps2: -1.5
    stop_decel_mps2: -1.5
    use_pure_pursuit_on_mpc_cmd_timeout: true
    use_pure_pursuit_on_mpc_health_timeout: false
    use_mpc_on_pure_pursuit_cmd_timeout: false
    debug_publish_period_sec: 0.25
    enable_steering_rate_limit: true
    max_steering_angle_rad: 1.708
    max_steering_rate_radps: 8.0
    max_steering_delta_per_cycle: 0.0
    steering_limiter_reset_dt_sec: 0.50
    reset_steering_limiter_on_mode_change: false
    steering_log_throttle_sec: 1.0
