common:
  save_config: false

delay_aware_mpc:
  # Runtime C++ node parameters are exposed in delay_aware_mpc.launch.xml
  # so tuning_gui can edit them as launch XML parameters.
  # Keep these values mirrored when using this YAML as experiment metadata.
  enabled: true
  # Modes:
  #   baseline: existing MPC behavior with this package/config
  #   state_shift: predict pose at t + steering_delay_sec and solve from there
  #   state_shift_with_steer_lag: state_shift plus first-order steering lag
  #   delay_augmented: command-buffer delay prediction bridge for experiments
  mode: "state_shift_with_steer_lag"
  steering_delay_sec: 0.20
  prediction_dt: 0.02
  steering_time_constant_sec: 0.40
  use_reference_time_shift: true
  use_steering_status: true
  steering_status_timeout_sec: 0.20
  use_yaw_rate_fallback: true
  use_command_history_fallback: true
  min_velocity_for_yaw_prediction: 0.20
  publish_debug_topics: true
  debug_publish_period_sec: 0.25

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.０

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  csv_path: "env/final_ver3/traj_mincurv_manual.csv"
  resolution: 0.6
  smoothing_distance: 2
  max_width: 6.0
  circular: true
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  width: 1.4   # +safety margin

mpc:
  N: 50
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  R: [1000000.0, 10.0]
  a_min: 0 # m/s^2
  a_max: 3.0 # m/s^2
  delta_max_deg: 32.0 # degrees
  steer_rate_max: 1.0 # rad/s
  control_rate: 40.0 # Hz
  steering_tire_angle_gain_var: 1.639
  # steering_tire_angle_gain_var: 1.0
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  accel_low_pass_gain: 1.0
  steer_low_pass_gain: 1.0
  # Delay-aware prediction already shifts the control state/reference projection.
  # Keep this at 0 to avoid double compensation against the baseline MPC offset.
  wp_id_offset: 0
  use_max_kappa_pred: true
  lateral_target_mode: "reference_path"
  wall_margin_m: 0.15
  use_curvature_speed_profile: true
  use_ref_vel_as_speed_cap: true
  speed_profile_debug_publish_period_sec: 0.25
  use_grade_accel_feedforward: true
  grade_ff_gain: 1.0
  grade_ff_max_accel_mps2: 1.0
  grade_ff_window_m: 2.0
  grade_ff_min_distance_delta_m: 0.5
  grade_ff_min_speed_mps: 0.3
  grade_ff_low_pass_gain: 0.25
  grade_ff_only_when_not_decelerating: true
  grade_ff_speed_error_deadband_mps: 0.1


  ## ---------- 究極 ------------- ##
  ## Lap1: 53s, Lap2: 47s

  v_max: 35.0   # km/h
  ay_max: 30  # m/s^2, maximum lateral acceleration in curves
  Q: [300000.0, 100000000.0, 600000.0]
  QN: [1000000.0, 1000000.0, 60000.0]

  ## --- 高速 (gnss delay 0.3) --- ##
