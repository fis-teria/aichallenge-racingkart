[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-pure-pursuit"
version = "0.1.0"
description = "Reproducible genetic search runner for Simple Pure Pursuit"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ga-pure-pursuit = "ga_pure_pursuit.cli:main"
ga-plot-diagnostics = "ga_pure_pursuit.diagnostics:main"
ga-progress-dashboard = "ga_pure_pursuit.progress_dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
