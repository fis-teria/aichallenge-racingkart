x-autoware-base: &autoware-base
  image: "aichallenge-2025-dev"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  environment:
    - DISPLAY=${DISPLAY}
    - USER=${USER}
    - ROS_DISTRO=humble
    - XAUTHORITY=${XAUTHORITY}
    - QT_X11_NO_MITSHM=1
    - TZ=Asia/Tokyo
    - RUN_MODE=${RUN_MODE:-}
    - SIM_MODE=${SIM_MODE:-}
    - AWSIM_HEADLESS=${AWSIM_HEADLESS:-false}
    - CMD=${CMD:-}
    - COLCON_TRACE=${COLCON_TRACE:-}
    - ROS_HOME=${ROS_HOME:-}
    - ROS_LOG_DIR=${ROS_LOG_DIR:-}
    - HOST_UID=${HOST_UID:-}
    - HOST_GID=${HOST_GID:-}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - GA_EXPERIMENT_MODE=${GA_EXPERIMENT_MODE:-false}
    - GA_CONFIG=${GA_CONFIG:-/aichallenge/ml_workspace/genetic_algorithm/config/experiment_ros2.yaml}
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./aichallenge:/aichallenge
    - ./remote:/remote
    - ./vehicle:/vehicle
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Audio (PipeWire/Pulse) socket access on the host
    - /run/user:/run/user:rw
    - /dev/dri:/dev/dri
    - ${XAUTHORITY}:${XAUTHORITY}:rw
  devices:
    - /dev/dri
    - /dev/video0
    - /dev/input
  working_dir: ${LOG_DIR:-/aichallenge}

x-autoware-eval-base: &autoware-eval-base
  <<: *autoware-base
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    # /aichallenge is baked into the eval image; intentionally not mounted here
    # - ./aichallenge:/aichallenge
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Audio (PipeWire/Pulse) socket access on the host
    - /run/user:/run/user:rw
    - /dev/dri:/dev/dri
    - ${XAUTHORITY}:${XAUTHORITY}:rw

x-racing_kart_interface-base: &racing_kart_interface-base
  image: "ghcr.io/tier4/racing_kart_interface:latest-experiment"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  environment:
    - DISPLAY=${DISPLAY}
    - USER=${USER}
    - TZ=Asia/Tokyo
    - ROS_DISTRO=humble
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - NTRIP_USERNAME=${NTRIP_USERNAME:-}
    - NTRIP_PASSWORD=${NTRIP_PASSWORD:-}
  volumes:
    - /dev/vcu:/dev/vcu
    - /dev/gnss:/dev/gnss
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri
  devices:
    - /dev/dri
  group_add:
    - dialout
  working_dir: /workspace

services:
  rosbag-cleaner:
    <<: *autoware-base
    privileged: false
    restart: unless-stopped
    entrypoint: ["/aichallenge/utils/cleanup_rosbags.bash"]
    command: []
    environment:
      - ROSBAG_RETENTION_MINUTES=${ROSBAG_RETENTION_MINUTES:-180}
      - ROSBAG_ACTIVE_GRACE_MINUTES=${ROSBAG_ACTIVE_GRACE_MINUTES:-10}
      - ROSBAG_CLEAN_INTERVAL_SECONDS=${ROSBAG_CLEAN_INTERVAL_SECONDS:-300}
      - ROSBAG_MAX_TOTAL_GB=${ROSBAG_MAX_TOTAL_GB:-20}

  ga-runner:
    <<: *autoware-base
    privileged: false
    restart: "no"
    environment:
      - ROS_DOMAIN_ID=1
      - GA_EXPERIMENT_MODE=true
      - GA_CONFIG=${GA_CONFIG:-/aichallenge/ml_workspace/genetic_algorithm/config/experiment_ros2.yaml}
      - GA_RESUME_RUN_DIR=${GA_RESUME_RUN_DIR:-}
      - GA_EVALUATOR_CONFIG=${GA_EVALUATOR_CONFIG:-}
      - GA_PARALLEL_WORKERS=${GA_PARALLEL_WORKERS:-3}
      - GA_WORKER_IDS=${GA_WORKER_IDS:-worker-1,worker-2,worker-3}
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/humble/setup.bash &&
        source /aichallenge/workspace/install/setup.bash &&
        export PYTHONPATH=/aichallenge/ml_workspace/genetic_algorithm/src:$${PYTHONPATH:-} &&
        if [ -n "$${GA_RESUME_RUN_DIR}" ]; then
          evaluator_args=();
          if [ -n "$${GA_EVALUATOR_CONFIG}" ]; then
            evaluator_args+=(--evaluator-config "$${GA_EVALUATOR_CONFIG}");
          fi;
          exec python3 -m ga_pure_pursuit.cli resume \
          --run-dir "$${GA_RESUME_RUN_DIR}" \
          --parallel-workers "$${GA_PARALLEL_WORKERS}" \
          "$${evaluator_args[@]}";
        else
          exec python3 -m ga_pure_pursuit.cli search \
          --config "$${GA_CONFIG}" \
          --runs-dir /aichallenge/ml_workspace/genetic_algorithm/runs;
        fi

  # Autoware service
  autoware:
    <<: *autoware-base
    command: ["bash", "-lc", "exec /aichallenge/run_autoware.bash ${RUN_MODE:-awsim} ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

  # Autoware service
  autoware-build:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/build_autoware.bash ${HOST_UID:-} ${HOST_GID:-}"]

  simulator:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec env PULSE_SERVER=unix:/run/user/${HOST_UID:-1000}/pulse/native /aichallenge/run_simulator.bash ${SIM_MODE:-} >\"${LOG_DIR:-/output}/awsim.log\" 2>&1"]

  autoware-command:
    <<: *autoware-base
    command: ["bash", "-lc", "cd ${CMD_WORKDIR:-/aichallenge} && exec bash -lc \"${CMD:-}\""]

  autoware-simulator-evaluation:
    <<: *autoware-eval-base
    image: "aichallenge-2025-eval"
    command: ["bash", "-lc", "exec /aichallenge/run_evaluation.bash"]

### Autoware Service For Parallel Execution ###
  autoware-d1:
    <<: *autoware-eval-base
    image: "autoware-d1"
    command: ["bash", "-lc", "exec env ROS_DOMAIN_ID=1 ros2 launch aichallenge_system_launch aichallenge_system.launch.xml simulation:=true use_sim_time:=true run_rviz:=true domain_id:=1 > \"${LOG_DIR:-/output}/autoware.log\" 2>&1"]

  autoware-d2:
    <<: *autoware-eval-base
    image: "autoware-d2"
    command: ["bash", "-lc", "exec env ROS_DOMAIN_ID=2 ros2 launch aichallenge_system_launch aichallenge_system.launch.xml simulation:=true use_sim_time:=true run_rviz:=true domain_id:=2 > \"${LOG_DIR:-/output}/autoware.log\" 2>&1"]

  autoware-d3:
    <<: *autoware-eval-base
    image: "autoware-d3"
    command: ["bash", "-lc", "exec env ROS_DOMAIN_ID=3 ros2 launch aichallenge_system_launch aichallenge_system.launch.xml simulation:=true use_sim_time:=true run_rviz:=true domain_id:=3 > \"${LOG_DIR:-/output}/autoware.log\" 2>&1"]

  autoware-d4:
    <<: *autoware-eval-base
    image: "autoware-d4"
    command: ["bash", "-lc", "exec env ROS_DOMAIN_ID=4 ros2 launch aichallenge_system_launch aichallenge_system.launch.xml simulation:=true use_sim_time:=true run_rviz:=true domain_id:=4 > \"${LOG_DIR:-/output}/autoware.log\" 2>&1"]

#### vehicle specific services can be added here ####
  # Zenoh service
  zenoh:
    <<: *autoware-base
    working_dir: /vehicle
    command: ["bash", "-c", "case ${VEHICLE_ID:-} in A2) PORT=7448;; A3) PORT=7449;; A6) PORT=7450;; A7) PORT=7451;; A1) PORT=7452;; A5) PORT=7453;; A8) PORT=7454;; *) echo 'Invalid VEHICLE_ID'; exit 1;; esac && zenoh-bridge-ros2dds client -e tls/13.231.141.103:$$PORT -c /vehicle/zenoh.json5"]

  # Driver service
  driver:
    <<: *racing_kart_interface-base
    command: ['vehicle']

#### remote visualization services ####
  rviz2:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/utils/run_rviz.bash remote"]
